# =====================================================================
#  biokitty — kitty configuration
#  ~/.config/kitty/kitty.conf
#
#  Reload after editing with ctrl+shift+f5, or restart kitty.
#  Full reference:  kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'
#  Docs:            https://sw.kovidgoyal.net/kitty/conf/
#
#  This file holds only the font and shell settings. Everything else is
#  split into siblings so a change to one area cannot disturb another:
#
#      ui.conf            window, tabs, cursor, transparency, DNA logo
#      themes/*.conf      five bio palettes
#      active-theme.conf  whichever one biokitty-theme last selected
#      marks.conf         sequence and identifier highlighting
#      keys.conf          bindings, including every kitten
#      tab_bar.py         the nucleotide tab bar
#      open-actions.conf  what a clicked .pdb or .fasta opens with
#      diff.conf          colours for the diff kitten
#      sessions/          saved layouts
#
#  Comment out any include below to drop that layer; the rest keep
#  working on their own.
# =====================================================================


# ---------------------------------------------------------------------
#  FONT
#
#  FantasqueSansM Nerd Font is the Nerd Font build rather than plain
#  Fantasque Sans Mono, so the powerline and device glyphs used by the
#  tab bar and by fastfetch resolve instead of rendering as boxes.
#
#  To switch fonts, change font_family and leave the other three on
#  "auto" — kitty derives bold/italic from the family. Browse what is
#  installed with:  kitten choose_fonts   (or ctrl+shift+k>f)
# ---------------------------------------------------------------------
font_family        FantasqueSansM Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto

font_size          12.0

# Leave both of these at 100%.
#
# They stretch or squeeze the character cell, which is exactly what
# breaks column alignment in ASCII art — the DNA helix in fastfetch is
# drawn on the assumption that every cell is the font's natural width.
# Nudging these by even a pixel makes the helix skew relative to the
# info column beside it.
modify_font        cell_width   100%
modify_font        cell_height  100%

# Fantasque ships programming ligatures. kitty still lays out one glyph
# per cell, so they do not affect the art. Set this to "always" if you
# would rather see -> and != as separate characters.
disable_ligatures  never


# ---------------------------------------------------------------------
#  SHELL
#
#  shell_integration gives kitty prompt marking, cwd tracking (so new
#  windows open in the same directory), jumping between prompts with
#  ctrl+shift+z / ctrl+shift+x, and the "last command output" binding.
#  notify_on_cmd_finish in ui.conf depends on it too.
# ---------------------------------------------------------------------
shell               .
shell_integration   enabled
term                xterm-kitty
editor              .


# ---------------------------------------------------------------------
#  LAYERS
#
#  Order matters: the default palette loads first, then whatever
#  biokitty-theme has selected overrides it. globinclude rather than
#  include so a fresh install with no theme chosen yet is not an error.
# ---------------------------------------------------------------------
include            ui.conf
include            themes/digital-helix.conf
globinclude        active-theme.conf
include            marks.conf
include            keys.conf


# ---------------------------------------------------------------------
#  STARTUP SESSION
#
#  Uncomment to open the three-pane lab bench on every launch. Left off
#  by default because it overrides the single-window geometry that the
#  fastfetch banner is sized for.
# ---------------------------------------------------------------------
# startup_session   sessions/bench.conf
