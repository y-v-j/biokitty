# =====================================================================
#  biokitty — open actions
#  ~/.config/kitty/open-actions.conf
#
#  Decides what happens when you click (or hint-select) a path or URL.
#  kitty checks each block top to bottom and runs the first match, so
#  the specific formats come first and the generic text handler last.
#
#  Test a path without clicking anything:
#      kitten open-actions /path/to/file.pdb
# =====================================================================


# --- structures ------------------------------------------------------
# PyMOL opens its own window, so launch with no kitty window attached.
protocol file
ext pdb,cif,mmcif,ent,pdbqt,mol2,sdf,xyz
action launch --type=background pymol ${FILE_PATH}


# --- sequence and alignment files ------------------------------------
# Straight into a stats overlay: length, GC, composition per record.
protocol file
ext fa,fasta,fna,faa,ffn,frn,fq,fastq,aln,sto,phy,nex
action launch --type=overlay --cwd=current sh -c "biokitty-seq stats < ${FILE_PATH}"


# --- tabular genomics formats ----------------------------------------
# These are wide; the pager with wrapping off is the only sane view.
protocol file
ext vcf,bed,gff,gff3,gtf,sam,bedgraph,wig,tsv
action launch --type=overlay --cwd=current less --chop-long-lines --RAW-CONTROL-CHARS ${FILE_PATH}


# --- notebooks -------------------------------------------------------
protocol file
ext ipynb
action launch --type=background xdg-open ${FILE_PATH}


# --- images ----------------------------------------------------------
# icat draws them inline through the graphics protocol, same mechanism
# the fastfetch banner uses.
protocol file
ext png,jpg,jpeg,gif,webp,bmp,tiff,svg
action launch --type=overlay --cwd=current sh -c "kitten icat --hold ${FILE_PATH}"


# --- PDFs and documents ----------------------------------------------
protocol file
ext pdf,djvu,epub,docx,odt,xlsx,pptx
action launch --type=background xdg-open ${FILE_PATH}


# --- plain text and source -------------------------------------------
protocol file
mime text/*
action launch --type=overlay --cwd=current ${EDITOR} ${FILE_PATH}


# --- everything else -------------------------------------------------
protocol file
action launch --type=background xdg-open ${FILE_PATH}
