# =====================================================================
#  biokitty — "lab bench" startup session
#  ~/.config/kitty/sessions/bench.conf
#
#  A three-pane working layout plus a second tab for structure work.
#  Not loaded by default; start it explicitly:
#
#      kitty --session ~/.config/kitty/sessions/bench.conf
#
#  or make it the default by uncommenting the startup_session line in
#  kitty.conf. Panes are created with the "splits" layout, which ui.conf
#  lists first in enabled_layouts.
# =====================================================================

new_tab bench
layout splits
cd ~

# Main working shell, left half.
launch --title shell

# Right column: a scratch shell above, a watcher below.
launch --location=vsplit --title scratch
launch --location=hsplit --title watch

# Land in the main shell rather than the last one created.
focus_matching_window title:shell


new_tab structures
layout stack
cd ~
launch --title pymol
