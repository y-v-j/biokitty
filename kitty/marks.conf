# =====================================================================
#  biokitty — sequence marks
#
#  kitty can highlight every occurrence of a pattern on screen ("marks").
#  There are three mark slots; their colours come from the active theme
#  (mark1/mark2/mark3_background in themes/*.conf).
#
#  Marks are toggles: press the binding again to clear that slot. The
#  patterns below are deliberately conservative — a nucleotide run has to
#  be at least 12 characters before it lights up, so ordinary English
#  words containing only a/c/g/t (like "cat" or "tag") do not.
#
#  Leader: ctrl+shift+m ("mark"), then one key.
# ---------------------------------------------------------------------

#  n — nucleotide runs. Finds sequence embedded in alignment output,
#      BLAST hits, log lines and pasted reads.
map ctrl+shift+m>n toggle_marker iregex 1 \b[ACGTUN]{12,}\b

#  f — FASTA headers, so record boundaries stand out when a multi-record
#      file scrolls past.
map ctrl+shift+m>f toggle_marker regex 2 ^>.*$

#  a — identifiers: PDB, UniProt, RefSeq, Ensembl, GEO, SRA, assemblies.
#      The same shapes biokitty-accession knows how to open.
map ctrl+shift+m>a toggle_marker iregex 3 \b(?:[0-9][A-Z0-9]{3}|[OPQ][0-9][A-Z0-9]{3}[0-9]|[NXW][MRPCGTW]_[0-9]+(?:\.[0-9]+)?|ENS[A-Z]*[GTP][0-9]{6,}|GS[EMP][0-9]+|[SED]RR[0-9]+|GC[AF]_[0-9]+\.[0-9]+|PF[0-9]{5}|IPR[0-9]{6})\b

#  e — errors and warnings. Not biology, but the mark that earns its
#      keystroke most often when a pipeline is running.
map ctrl+shift+m>e toggle_marker iregex 1 \b(error|failed|fatal|traceback)\b 2 \b(warn|warning|deprecated)\b

#  q — quality-line trouble in FASTQ dumps: runs of the lowest Phred
#      scores, which is what a failing run looks like from across a room.
map ctrl+shift+m>q toggle_marker regex 3 [!"#$%&'()*+,-]{10,}

#  0 — clear every mark.
map ctrl+shift+m>0 remove_marker

#  Jump between hits of mark 1 without touching the mouse.
map ctrl+shift+m>j scroll_to_mark next 1
map ctrl+shift+m>k scroll_to_mark prev 1
