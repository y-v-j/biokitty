# =====================================================================
#  biokitty — diff kitten theme
#  ~/.config/kitty/diff.conf
#
#  Used by:  kitten diff a b        (ctrl+shift+k>d, or the `kd` alias)
#
#  Colours track the Digital Helix palette rather than the active theme:
#  the diff kitten reads this file directly and has no way to follow
#  biokitty-theme. Added lines lean green, removed lean red, and both
#  sit on the same navy ground as the terminal so a diff opened in an
#  overlay does not flash a different background.
# =====================================================================

pygments_style          monokai
num_context_lines       3
replace_tab_by          "    "

foreground              #cfe8ff
background              #031640
title_fg                #eaf6ff
title_bg                #0a2350

margin_bg               #010c26
margin_fg               #3d5a80
margin_filler_bg        #031640

added_bg                #0c3325
highlight_added_bg      #145a3f
added_margin_bg         #0a2a1e

removed_bg              #3d1420
highlight_removed_bg    #5e1c2e
removed_margin_bg       #300f19

filler_bg               #061029
hunk_bg                 #0a2350
hunk_margin_bg          #1e4d7b

search_bg               #fbbf24
search_fg               #031640
select_bg               #1e4d7b
select_fg               #eaf6ff

# Treat bioinformatics text formats as things worth syntax-highlighting.
syntax_aliases          fasta:text fa:text fastq:text gff:text gtf:text vcf:text bed:text pdb:text cif:text nf:groovy smk:python
