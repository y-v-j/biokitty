# =====================================================================
#  biokitty — window, tab bar and visual layer
#  Included from kitty.conf. Reload with ctrl+shift+f5.
# =====================================================================


# ---------------------------------------------------------------------
#  WINDOW GEOMETRY
#
#  The initial size fits the fastfetch banner without wrapping: the
#  widest logos (the protein renders) are 42-43 columns plus 6 of
#  padding, and the widest info row runs to about 60. Below ~110
#  columns the info column wraps and the layout falls apart.
#
#  remember_window_size must stay "no" or kitty restores whatever size
#  you last used and ignores the values below.
# ---------------------------------------------------------------------
remember_window_size      no
initial_window_width      124c
initial_window_height     38c

window_padding_width      8
window_margin_width       0
placement_strategy        center
confirm_os_window_close   0

# Wayland: use the system titlebar so KDE decorations behave.
linux_display_server      auto
wayland_titlebar_color    background


# ---------------------------------------------------------------------
#  TRANSPARENCY
#
#  0.94 is deliberately shy of full opacity: enough for the desktop to
#  show through, not enough to hurt contrast on the dark palettes. KDE
#  Plasma honours background_blur on Wayland; compositors that don't
#  simply ignore it and you get plain transparency.
#
#  dynamic_background_opacity lets you nudge it live with
#  ctrl+shift+a > m / l  (see keys.conf).
# ---------------------------------------------------------------------
background_opacity          0.96
background_blur             32
dynamic_background_opacity  yes


# ---------------------------------------------------------------------
#  WINDOW LOGO  —  the DNA watermark
#
#  Every window gets the helix ghosted into its bottom-right corner at
#  6% alpha, scaled to 26% of the shorter window dimension. Both numbers
#  matter: at natural size (window_logo_scale 0) the helix is large
#  enough to compete with the text instead of sitting behind it.
#
#  The path is resolved relative to the kitty config directory, so
#  install.sh drops a copy of dna-helix.png into ~/.config/kitty/.
#  Set window_logo_alpha to 0 to turn it off without editing anything
#  else, or point window_logo_path at your own PNG.
# ---------------------------------------------------------------------
window_logo_path        dna-helix.png
window_logo_position    bottom-right
window_logo_alpha       0.06
window_logo_scale       26


# ---------------------------------------------------------------------
#  CURSOR
#
#  cursor_trail draws a comet tail behind large cursor jumps. The value
#  is a threshold in milliseconds — a cursor that has been parked for
#  longer than this gets a trail when it next moves, so ordinary typing
#  stays still and only real jumps animate.
# ---------------------------------------------------------------------
cursor_shape              block
cursor_blink_interval     -1
cursor_stop_blinking_after 15.0
cursor_trail              3
cursor_trail_decay        0.1 0.4


# ---------------------------------------------------------------------
#  TAB BAR
#
#  tab_bar_style "custom" hands drawing to tab_bar.py, which renders
#  each tab as a base pair with a fork/activity indicator and puts a
#  live status readout on the right. Delete the tab_bar_style line to
#  fall back to kitty's built-in powerline bar; nothing else depends
#  on it.
# ---------------------------------------------------------------------
tab_bar_style             custom
tab_bar_align             left
tab_bar_edge              top
tab_bar_min_tabs          1
tab_bar_margin_height     0.0 0.0
tab_powerline_style       slanted
tab_activity_symbol       ●
tab_title_max_length      24
tab_title_template        "{title}"
active_tab_title_template "{title}"
active_tab_font_style     bold
inactive_tab_font_style   normal


# ---------------------------------------------------------------------
#  LAYOUTS
#
#  "splits" first so ctrl+shift+enter opens a pane beside the current
#  one rather than replacing the layout. The lab-bench session in
#  sessions/bench.conf assumes splits is available.
# ---------------------------------------------------------------------
enabled_layouts           splits,stack,tall,fat,grid,horizontal,vertical
inactive_text_alpha       0.85
window_border_width       1pt
draw_minimal_borders      yes


# ---------------------------------------------------------------------
#  TEXT RENDERING
# ---------------------------------------------------------------------
undercurl_style           thin-sparse
url_style                 curly
show_hyperlink_targets    yes
underline_hyperlinks      hover

# Double-clicking a word should grab a whole accession, not stop at the
# punctuation inside it. This makes NM_000546.6, P0DTC2, 1EMA:A and
# GCF_000001405.40 select in one go.
select_by_word_characters @-./_:+~=%


# ---------------------------------------------------------------------
#  SCROLLBACK & BELL
# ---------------------------------------------------------------------
scrollback_lines              20000
scrollback_pager_history_size 64
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

enable_audio_bell         no
visual_bell_duration      0.08
visual_bell_color         none
window_alert_on_bell      yes

# Desktop notification when a command that took a while finishes and
# you have looked away. Needs shell_integration, which kitty.conf sets.
notify_on_cmd_finish      unfocused 15.0


# ---------------------------------------------------------------------
#  MOUSE
# ---------------------------------------------------------------------
mouse_hide_wait           3.0
copy_on_select            no
strip_trailing_spaces     smart
touch_scroll_multiplier   2.0
paste_actions             quote-urls-at-prompt,confirm-if-large


# ---------------------------------------------------------------------
#  REMOTE CONTROL
#
#  socket-only rather than "yes": the theme switcher and the sequence
#  kittens talk to kitty over the socket below, but a random program
#  that happens to be running in the terminal cannot drive it just by
#  writing escape codes to stdout.
#
#  biokitty-theme uses this to recolour running windows instantly.
# ---------------------------------------------------------------------
allow_remote_control      socket-only
listen_on                 unix:@biokitty
