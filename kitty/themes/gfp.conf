# =====================================================================
#  biokitty theme — Green Fluorescent Protein             (slug: gfp)
#
#  The 1EMA chromophore emits at 509 nm. This palette puts that green
#  on a near-black ground the way a fluorescence micrograph shows it:
#  almost nothing in the background, everything in the signal.
#
#  Pair with: config-gfp.jsonc (GFP barrel banner)
#  Switch to it with:  biokitty-theme gfp
# =====================================================================

