# =====================================================================
#  biokitty theme — Digital Helix                        (slug: helix)
#
#  The original biokitty palette. Deep navy ground with a blue-to-cyan
#  ramp, sampled from the DNA banner artwork so the image sits on the
#  background rather than floating in a rectangle of the wrong blue.
#
#  Pair with: config.jsonc (DNA helix banner)
#  Switch to it with:  biokitty-theme helix
# =====================================================================

background              #031640
foreground              #cfe8ff

cursor                  #4fc3f7
cursor_text_color       #031640

selection_background    #1e4d7b
selection_foreground    #eaf6ff

url_color               #4fc3f7

active_border_color     #4fc3f7
inactive_border_color   #1e4d7b
bell_border_color       #fbbf24

active_tab_background   #1e4d7b
active_tab_foreground   #eaf6ff
inactive_tab_background #0a2350
inactive_tab_foreground #7fa8cc
tab_bar_background      #010c26

# Sequence marks (see marks.conf)
mark1_foreground #031640
mark1_background #4fc3f7
mark2_foreground #031640
mark2_background #4ade80
mark3_foreground #031640
mark3_background #fbbf24

# Normal colours (0-7)
color0  #031640
color1  #ff6b81
color2  #4ade80
color3  #fbbf24
color4  #3b82f6
color5  #a78bfa
color6  #22d3ee
color7  #cfe8ff

# Bright colours (8-15)
color8  #3d5a80
color9  #ff8fa3
