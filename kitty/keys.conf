# =====================================================================
#  biokitty — key bindings
#
#  kitty's own defaults are kept; everything here is additional. Three
#  leaders group the additions so nothing collides with the defaults:
#
#      ctrl+shift+b   bio      sequence operations on the selection
#      ctrl+shift+k   kittens  launch a kitten
#      ctrl+shift+a   appearance (extends kitty's own opacity leader)
#      ctrl+shift+m   marks    (see marks.conf)
#
#  Press a leader and wait — kitty shows the available follow-on keys.
# ---------------------------------------------------------------------


# ---------------------------------------------------------------------
#  DISPLACED DEFAULTS
#
#  Two of the leaders below take over keys kitty binds by default:
#      ctrl+shift+b   was move_window_backward
#      ctrl+shift+k   was scroll_line_up
#  Later map lines win in kitty, so the leaders work either way; these
#  lines make the intent explicit and give both actions a new home
#  rather than quietly dropping them.
# ---------------------------------------------------------------------
map ctrl+alt+b          move_window_backward
map ctrl+alt+k          scroll_line_up
map ctrl+alt+j          scroll_line_down


# ---------------------------------------------------------------------
#  BIO  —  ctrl+shift+b
#
#  Each of these pipes the current selection into biokitty-seq, which
#  runs biotools.py and holds the result in an overlay until you press a
#  key. Select a sequence with the mouse first; with nothing selected
#  they say so rather than failing silently.
#
#  These call the scripts by bare name, so ~/.local/bin (where
#  install.sh puts them) must be on PATH.
# ---------------------------------------------------------------------
map ctrl+shift+b>r launch --type=overlay --stdin-source=@selection biokitty-seq revcomp
map ctrl+shift+b>c launch --type=overlay --stdin-source=@selection biokitty-seq complement
map ctrl+shift+b>t launch --type=overlay --stdin-source=@selection biokitty-seq translate
map ctrl+shift+b>1 launch --type=overlay --stdin-source=@selection biokitty-seq translate --frame 1
map ctrl+shift+b>2 launch --type=overlay --stdin-source=@selection biokitty-seq translate --frame 2
map ctrl+shift+b>3 launch --type=overlay --stdin-source=@selection biokitty-seq translate --frame 3
map ctrl+shift+b>s launch --type=overlay --stdin-source=@selection biokitty-seq stats
map ctrl+shift+b>o launch --type=overlay --stdin-source=@selection biokitty-seq orf
map ctrl+shift+b>w launch --type=overlay --stdin-source=@selection biokitty-seq wrap

#  Whole-screen variants: analyse everything visible, not just a selection.
map ctrl+shift+b>shift+s launch --type=overlay --stdin-source=@screen biokitty-seq stats

#  a — pick an identifier off the screen and open its database page.
#      hints has no URL templating, so the match is handed to
#      biokitty-accession, which works out which database it belongs to.
map ctrl+shift+b>a kitten hints --type regex --program biokitty-accession --regex \b(?:[0-9][A-Za-z0-9]{3}|[OPQ][0-9][A-Z0-9]{3}[0-9]|[NXW][MRPCGTW]_[0-9]+(?:\.[0-9]+)?|ENS[A-Z]*[GTP][0-9]{6,}|GS[EMP][0-9]+|[SED]RR[0-9]+|GC[AF]_[0-9]+\.[0-9]+|PF[0-9]{5}|IPR[0-9]{6}|GO:[0-9]{7})\b

#  p — PDB IDs only, straight into a structure viewer.
map ctrl+shift+b>p kitten hints --type regex --program biokitty-accession --regex \b[0-9][A-Za-z0-9]{3}\b

#  d — DOIs and PubMed IDs from a paper's output.
map ctrl+shift+b>d kitten hints --type regex --program biokitty-accession --regex (?:10\.[0-9]{4,9}/[^\s]+|PMID:?\s*[0-9]{7,8})

#  y — copy a bare sequence (headers, digits and whitespace stripped)
#      straight to the clipboard, ready to paste into a web form.
map ctrl+shift+b>y launch --type=background --stdin-source=@selection sh -c "biokitty-seq clean | tail -n +3 | kitten clipboard"


# ---------------------------------------------------------------------
#  KITTENS  —  ctrl+shift+k
#
#  kitty ships these; this leader just gives them all a home. The ones
#  that are commands rather than interactive pickers (icat, ssh,
#  transfer, hyperlinked_grep, notify) get shell aliases instead — see
#  shell/biokitty.bashrc.
# ---------------------------------------------------------------------
map ctrl+shift+k>t kitten themes
map ctrl+shift+k>f kitten choose_fonts
map ctrl+shift+k>u kitten unicode_input
map ctrl+shift+k>b kitten broadcast
map ctrl+shift+k>s kitten show_key
map ctrl+shift+k>q kitten query_terminal
map ctrl+shift+k>r kitten resize_window
map ctrl+shift+k>c kitten choose_files
map ctrl+shift+k>h kitten hints --type hyperlink
map ctrl+shift+k>w kitten hints --type word --program -
map ctrl+shift+k>l kitten hints --type line --program -
map ctrl+shift+k>n kitten hints --type linenum
map ctrl+shift+k>P command_palette

#  Diff two paths chosen interactively.
map ctrl+shift+k>d launch --type=os-window --cwd=current kitten diff


# ---------------------------------------------------------------------
#  APPEARANCE  —  ctrl+shift+a
#
#  kitty already owns this leader for background opacity (m/l/1/d).
#  These add theme switching alongside it.
# ---------------------------------------------------------------------
map ctrl+shift+a>n launch --type=background biokitty-theme --next
map ctrl+shift+a>r launch --type=background biokitty-theme random
map ctrl+shift+a>t kitten themes


# ---------------------------------------------------------------------
#  WINDOWS, TABS & LAYOUTS
# ---------------------------------------------------------------------
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+w        close_window
map ctrl+shift+f5       load_config_file
map ctrl+shift+f2       edit_config_file

map ctrl+shift+f6       toggle_layout stack
map ctrl+shift+f11      toggle_fullscreen
map ctrl+shift+f10      toggle_maximized

#  Split the current pane (needs the "splits" layout, first in ui.conf).
#  These sit on ctrl+alt rather than ctrl+shift so they do not displace
#  kitty's own font-size and layout bindings.
map ctrl+alt+minus      launch --location=hsplit --cwd=current
map ctrl+alt+backslash  launch --location=vsplit --cwd=current

#  Left at kitty's defaults on purpose:
#    ctrl+shift+l           next_layout
#    ctrl+shift+z / +x      jump to previous / next prompt
#    ctrl+shift+equal / +minus / +0   font size


# ---------------------------------------------------------------------
#  SCROLLBACK & OUTPUT
#
#  shell_integration makes these work: kitty knows where each prompt
#  started, so it can pull out just the last command's output.
# ---------------------------------------------------------------------
map ctrl+shift+h        show_scrollback
map ctrl+shift+g        show_last_command_output
map ctrl+shift+alt+c    copy_ansi_to_clipboard
